name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the environment (ftwd, validators, tooling)
        run: uv sync --frozen

      - name: Lint the tooling
        run: uv run pyflakes tools/*.py tests/*.py

      # CI_LIGHT exempts asset hrefs with a data suffix from the link check.
      # The checkout holds the metadata and not the bytes. Structural links
      # and every non-data asset still resolve. Leave it unset locally.
      - name: Catalog gates
        env:
          CI_LIGHT: "1"
        run: uv run python tests/run_all.py
