name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every group, not just the changed ones: catches what the scoped runs
  # cannot, such as a new stac-check release that rejects an untouched
  # collection.
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Every gate except the three that read the whole catalog.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the environment (ftwd, validators, tooling)
        run: uv sync --frozen

      - name: Lint the tooling
        run: uv run pyflakes tools/*.py tests/*.py

      - name: Catalog gates
        env:
          CI_LIGHT: "1"
        run: uv run python tests/run_all.py --skip-slow

  # The source groups the slow gates check: on a PR or push, those changed
  # since the base plus a sample; on a scheduled or manual run, all of them.
  scope:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope compares against the base, so it needs the history.
          fetch-depth: 0

      # scope.py needs only the standard library (3.11+); the runner has 3.12.
      - id: list
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) export BDC_SCOPE_BASE="origin/$PR_BASE" ;;
            push)
              # A new branch has no before; a force push may leave it out of the clone.
              if [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                export BDC_SCOPE_BASE="$BEFORE"
              else
                export BDC_SCOPE_BASE="HEAD^1"
              fi ;;
          esac
          groups=$(python3 tests/scope.py --groups-json)
          echo "groups=$groups"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  # One job per group, so a change that touches every group is not one long job.
  slow:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.scope.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the environment (ftwd, validators, tooling)
        run: uv sync --frozen

      # CI_LIGHT exempts asset hrefs with a data suffix from the link check.
      # The checkout holds the metadata and not the bytes. Structural links
      # and every non-data asset still resolve. Leave it unset locally.
      - name: Links, STAC and conformance for ${{ matrix.group }}
        env:
          CI_LIGHT: "1"
          BDC_SCOPE_GROUPS: ${{ matrix.group }}
        run: uv run python tests/run_all.py --only-slow
