[project]
name = "benchmark-data-catalog"
version = "0.1.0"
description = "Git-backed Portolan catalog for the Fields of the World benchmark dataset"
requires-python = ">=3.11"
# The tooling has no package to install; this file only declares the environment.
dependencies = [
    # The dataset cutter. Pinned by commit while its Portolan conformance PRs
    # are open; switch to "ftw-dataset-tools==X.Y.Z" once released on PyPI.
    "ftw-dataset-tools @ git+https://github.com/fieldsoftheworld/ftw-dataset-tools@65bf813f74d70f992fba23166a68796dc5f638e4",
    # Validators, pinned to what CI runs (.github/workflows/ci.yml)
    "rashid>=0.1.5,<0.2.0",
    "stac-check>=1.6",
    # Catalog tooling
    "boto3>=1.35",
    "pyyaml>=6.0",
    "pillow>=10",
    "duckdb>=1.1",
    "pyflakes>=3.2",
    "requests>=2.31",
    # tools/build.py's subprocess_env imports this directly (for the CA
    # bundle fix) even though it also resolves transitively via requests.
    "certifi>=2024",
    # items.parquet rebuild (tools/catalogize.py). Both resolve transitively
    # via ftw-dataset-tools (which writes the mirror with rustac in the first
    # place) too, but catalogize.py imports them directly, so they are
    # declared explicitly.
    "pyarrow>=15",
    "rustac>=0.9",
]

[tool.uv]
package = false
