# ftwd recipe for Czech — 2020. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/cz_2020.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/cz/year=2020/cz-2020.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/cz/collection.json
output_dir: staging/cz_2020
name: cz_2020
year: 2020

metadata:
  title: "Czech — 2020"
  description: >
    Benchmark chips for Czech Republic cut from the 2020 edition of the
    harmonized field boundary collection cz.
  license: CC0-1.0
  version: 2.0.0-alpha.1
  attribution: "Czech Ministry of Agriculture (Ministr Zemědělství)"
  keywords: [field-boundaries, benchmark, cz, 2020]
  providers:
    - name: "Czech Ministry of Agriculture (Ministr Zemědělství)"
      roles: [producer, licensor]
      url: https://mze.gov.cz/public/portal/mze/farmar/LPIS
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    drop_border_chips: true
    admin_names: true
    field_embeddings: true
  masks:
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 2.5
    # Lines stay 10 m wide on the 2.5 m grid, as in v1.
    boundary_width_m: 10
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    class_filter: filters/czechia_filter.yaml
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
