# ftwd recipe for Trazo with splits — 2024. Input is one year of the harmonized (fiboa) collection.
# Labels are complete only inside work/extents/wri_trazo_ml_2024.parquet; tools/label_extent.py builds it.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/wri_trazo_ml_2024.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/wri_trazo_ml/year=2024/wri_trazo_ml-2024.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/wri_trazo_ml/collection.json
output_dir: staging/wri_trazo_ml_2024
name: wri_trazo_ml_2024
year: 2024

metadata:
  title: "Trazo with splits — 2024"
  description: >
    Benchmark chips for South America (Trazo regions) cut from the 2024 edition of the
    harmonized field boundary collection wri_trazo_ml.
  license: CC-BY-4.0
  version: 2.0.0-alpha.1
  attribution: "Grupp et al. (2026), Field Boundaries of South America, World Resources Institute & Arizona State University"
  keywords: [field-boundaries, benchmark, wri_trazo_ml, 2024]
  providers:
    - name: "World Resources Institute and Arizona State University"
      roles: [producer, licensor]
      url: https://source.coop/wri-data-lab/trazoannotations
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    # Border chips may cut wall-to-wall labels short; in presence-only data (or outside a
    # label extent) unlabelled pixels are unknown anyway, and sparse samples would lose every chip.
    drop_border_chips: false
  splits:
    # WRI's own split (the harmonized split column): its three test regions, all
    # annotated in 2020, are test and the rest train. Each chip takes its fields'
    # majority; with no val labels ftwd moves a random 20% of train chips to val.
    # 2021-2024 therefore have no test chips (user decision 2026-11-13).
    split_type: predefined
    random_seed: 42
  masks:
    mask_types: [semantic_2_class, semantic_3_class]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    # Unlabelled pixels inside the extent are background, outside unknown (3).
    label_extent: ../work/extents/wri_trazo_ml_2024.parquet
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
