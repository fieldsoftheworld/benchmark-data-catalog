# ftwd recipe for Catalonia — 2024. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/es_cat_2024.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/es_cat/year=2024/es_cat-2024.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/es_cat/collection.json
output_dir: staging/es_cat_2024
name: es_cat_2024
year: 2024

metadata:
  title: "Catalonia — 2024"
  description: >
    Benchmark chips for Spain-CAT cut from the 2024 edition of the
    harmonized field boundary collection es_cat.
  license: other
  license_url: https://administraciodigital.gencat.cat/ca/dades/dades-obertes/informacio-practica/llicencies/
  version: 2.0.0-alpha.1
  attribution: "Catalonia Department of Agriculture, Livestock, Fisheries and Food"
  keywords: [field-boundaries, benchmark, es_cat, 2024]
  providers:
    - name: "Catalonia Department of Agriculture, Livestock, Fisheries and Food"
      roles: [producer, licensor]
      url: https://agricultura.gencat.cat/ca/ambits/desenvolupament-rural/sigpac/mapa-cultius/
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    drop_border_chips: true
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    class_filter: filters/es_cat_filter.yaml
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
