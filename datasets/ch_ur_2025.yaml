# ftwd recipe for Switzerland, Uri — 2025. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/ch_ur_2025.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/ch/year=2025/ch_ur-2025.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/ch/collection.json
output_dir: staging/ch_ur_2025
name: ch_ur_2025
year: 2025

metadata:
  title: "Switzerland, Uri — 2025"
  description: >
    Benchmark chips for Switzerland cut from the 2025 edition of the
    harmonized field boundary collection ch.
  license: CC-BY-4.0
  version: 2.0.0-alpha.1
  attribution: "Quelle: Lisag AG (GIS Uri) — Landwirtschaftliche Nutzungsflächen, https://www.geodienste.ch/services/lwb_nutzungsflaechen"
  keywords: [field-boundaries, benchmark, ch_ur, 2025]
  providers:
    - name: "Kanton Uri, via geodienste.ch"
      roles: [producer, licensor]
      url: https://www.geodienste.ch/services/lwb_nutzungsflaechen
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    drop_border_chips: true
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    class_filter: filters/switzerland_filter.yaml
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
