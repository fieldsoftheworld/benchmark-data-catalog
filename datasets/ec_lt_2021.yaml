# ftwd recipe for Lithuania - Eurocrops 2021 — 2021. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/ec_lt_2021.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/ec_lt/year=2021/ec_lt-2021.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/ec_lt/collection.json
output_dir: staging/ec_lt_2021
name: ec_lt_2021
year: 2021

metadata:
  title: "Lithuania - Eurocrops 2021 — 2021"
  description: >
    Benchmark chips for Lithuania cut from the 2021 edition of the
    harmonized field boundary collection ec_lt.
  license: CC-BY-SA-4.0
  version: 2.0.0-alpha.1
  attribution: "Construction Sector Development Agency"
  keywords: [field-boundaries, benchmark, ec_lt, 2021]
  providers:
    - name: "Construction Sector Development Agency"
      roles: [producer, licensor]
      url: https://www.geoportal.lt/geoportal/nacionaline-mokejimo-agentura-prie-zemes-ukio-ministerijos#savedSearchId={56542726-DC0B-461E-A32C-3E9A4A693E27}&collapsed=true>, EuroCrops <https://github.com/maja601/EuroCrops
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    drop_border_chips: true
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    class_filter: filters/lithuania_filter.yaml
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
