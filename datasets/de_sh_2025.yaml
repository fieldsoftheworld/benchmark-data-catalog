# ftwd recipe for Germany, Schleswig-Holstein — 2025. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/de_sh_2025.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/de_sh/year=2025/de_sh-2025.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/de_sh/collection.json
output_dir: staging/de_sh_2025
name: de_sh_2025
year: 2025

metadata:
  title: "Germany, Schleswig-Holstein — 2025"
  description: >
    Benchmark chips for Germany-SH cut from the 2025 edition of the
    harmonized field boundary collection de_sh.
  license: DL-DE-ZERO-2.0
  version: 2.0.0-alpha.1
  attribution: "Land Schleswig-Holstein"
  keywords: [field-boundaries, benchmark, de_sh, 2025]
  providers:
    - name: "Land Schleswig-Holstein"
      roles: [producer, licensor]
      url: https://sh-mis.gdi-sh.de/catalog/#/datasets/iso/21f67269-780f-4f3c-8f66-03dde27acfe7
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    drop_border_chips: true
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    class_filter: filters/de-sh-filter.yaml
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
