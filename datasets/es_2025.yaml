# ftwd recipe for Spain — 2025. Input is derived from harmonized collections by tools/merge_es_2025.py;
# run it before building.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/es_2025.yaml   (tools/build.py wraps this)
version: 1

fields_file: work/es_2025.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/es/collection.json
output_dir: staging/es_2025
name: es_2025
year: 2025

metadata:
  title: "Spain — 2025"
  description: >
    Benchmark chips for Spain cut from the 2025 edition of the
    harmonized field boundary collection es.
  license: CC-BY-4.0
  version: 2.0.0-alpha.1
  attribution: "©FEGA / Ministerio de Agricultura, Pesca y Alimentación; Basque Government / Gobierno Vasco"
  keywords: [field-boundaries, benchmark, es, 2025]
  providers:
    - name: "Fondo Español de Garantía Agraria (FEGA)"
      roles: [producer, licensor]
      url: https://www.fega.gob.es
    - name: "Joint Research Centre, European Commission"
      roles: [producer, licensor]
      url: https://data.jrc.ec.europa.eu/dataset/b9fb9e67-78a9-4327-9d59-39a928d812d3
    - name: "Gobierno Vasco"
      roles: [producer, licensor]
      url: https://www.euskadi.eus/web01-tramite/es/contenidos/tramite_servicio/datos_geograficos_sigpac/es_def/index.shtml
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    drop_border_chips: true
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    class_filter: filters/es_merged_filter.yaml
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
