# ftwd recipe for Denmark — 2020. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/dk_2020.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/dk/year=2020/dk-2020.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/dk/collection.json
output_dir: staging/dk_2020
name: dk_2020
year: 2020

metadata:
  title: "Denmark — 2020"
  description: >
    Benchmark chips for Denmark cut from the 2020 edition of the
    harmonized field boundary collection dk.
  license: CC0-1.0
  version: 2.0.0-alpha.1
  attribution: "Danish Agricultural Agency"
  keywords: [field-boundaries, benchmark, dk, 2020]
  providers:
    - name: "Danish Agricultural Agency"
      roles: [producer, licensor]
      url: https://lbst.dk/
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    drop_border_chips: true
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    class_filter: filters/denmark_filter.yaml
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
