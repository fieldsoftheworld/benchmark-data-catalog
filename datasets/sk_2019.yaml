# ftwd recipe for Slovakia — 2019. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/sk_2019.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/sk/year=2019/sk-2019.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/sk/collection.json
output_dir: staging/sk_2019
name: sk_2019
year: 2019

metadata:
  title: "Slovakia — 2019"
  description: >
    Benchmark chips for Slovakia cut from the 2019 edition of the
    harmonized field boundary collection sk.
  license: CC0-1.0
  version: 2.0.0-alpha.1
  attribution: "Pôdohospodárska platobná agentúra"
  keywords: [field-boundaries, benchmark, sk, 2019]
  providers:
    - name: "Pôdohospodárska platobná agentúra"
      roles: [producer, licensor]
      url: https://www.apa.sk
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    drop_border_chips: true
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    class_filter: filters/slovakia_filter.yaml
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
