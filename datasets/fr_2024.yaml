# ftwd recipe for France — 2024. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/fr_2024.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/fr/year=2024/fr-2024.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/fr/collection.json
output_dir: staging/fr_2024
name: fr_2024
year: 2024

metadata:
  title: "France — 2024"
  description: >
    Benchmark chips for France cut from the 2024 edition of the
    harmonized field boundary collection fr.
  license: other
  license_url: https://etalab.gouv.fr/licence-ouverte-open-licence
  version: 2.0.0-alpha.1
  attribution: "IGN - Original data from https://geoservices.ign.fr/rpg"
  keywords: [field-boundaries, benchmark, fr, 2024]
  providers:
    - name: "Anstitut National de l'Information Géographique et Forestière"
      roles: [producer, licensor]
      url: https://www.data.gouv.fr/en/datasets/registre-parcellaire-graphique-rpg-contours-des-parcelles-et-ilots-culturaux-et-leur-groupe-de-cultures-majoritaire/
    - name: "Joint Research Centre, European Commission"
      roles: [producer, licensor]
      url: https://data.jrc.ec.europa.eu/dataset/b9fb9e67-78a9-4327-9d59-39a928d812d3
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    drop_border_chips: true
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    class_filter: filters/france_filter.yaml
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
