# ftwd recipe for Japan — 2023. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/jp_2023.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/jp/year=2023/jp-2023.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/jp/collection.json
output_dir: staging/jp_2023
name: jp_2023
year: 2023

metadata:
  title: "Japan — 2023"
  description: >
    Benchmark chips for Japan cut from the 2023 edition of the
    harmonized field boundary collection jp.
  license: CC-BY-4.0
  version: 2.0.0-alpha.1
  attribution: "出典：「筆ポリゴンデータ」（農林水産省）を加工して作成"
  keywords: [field-boundaries, benchmark, jp, 2023]
  providers:
    - name: "Japanese Ministry of Agriculture, Forestry and Fisheries (MAFF, 農林水産省)"
      roles: [producer, licensor]
      url: https://download.fude.maff.go.jp/
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    drop_border_chips: true
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    class_filter: filters/japan_filter.yaml
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
