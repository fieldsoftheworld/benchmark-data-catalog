# ftwd recipe for Mapping Africa — 2023. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/lacuna_2023.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/lacuna/year=2023/lacuna-2023.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/lacuna/collection.json
output_dir: staging/lacuna_2023
name: lacuna_2023
year: 2023

metadata:
  title: "Mapping Africa — 2023"
  description: >
    Benchmark chips for Africa (Mapping Africa sites) cut from the 2023 edition of the
    harmonized field boundary collection lacuna.
  license: other
  license_url: https://go.planet.com/nicfi-pla-2024
  version: 2.0.0-alpha.1
  attribution: "Estes et al. (2024), Lacuna Fund; labels digitised over Planet NICFI basemaps"
  keywords: [field-boundaries, benchmark, lacuna, 2023]
  providers:
    - name: "Agricultural Impacts Research Group, Clark University"
      roles: [producer, licensor]
      url: https://github.com/agroimpacts/lacunalabels
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    # Border chips may cut wall-to-wall labels short; in presence-only data unlabelled
    # pixels are unknown anyway, and sparse samples would lose every chip.
    drop_border_chips: false
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [semantic_2_class, semantic_3_class]
    resolution: 10.0
    workers: null
    presence_only: true
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
