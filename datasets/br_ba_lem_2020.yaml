# ftwd recipe for West Bahia, Brazil — 2020. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/br_ba_lem_2020.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/br_ba_lem/year=2020/br_ba_lem-2020.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/br_ba_lem/collection.json
output_dir: staging/br_ba_lem_2020
name: br_ba_lem_2020
year: 2020

metadata:
  title: "West Bahia, Brazil — 2020"
  description: >
    Benchmark chips for Brazil (west Bahia, LEM) cut from the 2020 edition of the
    harmonized field boundary collection br_ba_lem.
  license: CC-BY-4.0
  version: 2.0.0-alpha.1
  attribution: "Copyright © 2024 Elsevier inc, its licensors, and contributors."
  keywords: [field-boundaries, benchmark, br_ba_lem, 2020]
  providers:
    - name: "Mendeley Data"
      roles: [producer, licensor]
      url: https://data.mendeley.com/datasets/vz6d7tw87f/1#file-5ac1542b-12ef-4dce-8258-113b5c5d87c9
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    # Border chips may cut wall-to-wall labels short; in presence-only data (or outside a
    # label extent) unlabelled pixels are unknown anyway, and sparse samples would lose every chip.
    drop_border_chips: false
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [semantic_2_class, semantic_3_class]
    resolution: 10.0
    workers: null
    presence_only: true
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
