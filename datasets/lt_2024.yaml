# ftwd recipe for Lithuania — 2024. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/lt_2024.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/lt/year=2024/lt-2024.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/lt/collection.json
source_title: "Lithuania crop fields"
output_dir: staging/lt_2024
name: lt_2024
year: 2024

metadata:
  title: "Lithuania — 2024"
  description: >
    Benchmark chips for Lithuania cut from the 2024 edition of the
    harmonized field boundary collection lt.
  # NMA's geoportal.lt record: "Tik nekomerciniam naudojimui (Non-commercial use only)", copyright.
  license: other
  license_url: "https://www.geoportal.lt/metadata-catalog/catalog/search/resource/details.page?uuid=%7B7AF3F5B2-DC58-4EC5-916C-813E994B2DCF%7D"
  version: 2.0.0-alpha.1
  attribution: "Nacionalinė mokėjimo agentūra prie Žemės ūkio ministerijos"
  keywords: [field-boundaries, benchmark, lt, 2024]
  providers:
    - name: "Nacionalinė mokėjimo agentūra prie Žemės ūkio ministerijos"
      roles: [producer, licensor]
      url: https://www.nma.lt
    - name: "Europe-LAND HE Project"
      roles: [processor]
      url: https://doi.org/10.5281/zenodo.14230620
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    drop_border_chips: true
    admin_names: true
    field_embeddings: true
  masks:
    # Drop fields at least 95% under fields drawn over them (the instance mask can't show them).
    drop_hidden_fields: true
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 2.5
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    class_filter: filters/lithuania_filter.yaml
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
