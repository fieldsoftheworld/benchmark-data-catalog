# ftwd recipe for Rwanda with splits — 2021. Input is one year of the harmonized (fiboa) collection.
# Labels are complete only inside work/extents/rw_rwanda_ml_2021.parquet; tools/label_extent.py builds it.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/rw_rwanda_ml_2021.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/rw_rwanda_ml/year=2021/rw_rwanda_ml-2021.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/rw_rwanda_ml/collection.json
output_dir: staging/rw_rwanda_ml_2021
name: rw_rwanda_ml_2021
year: 2021

metadata:
  title: "Rwanda with splits — 2021"
  description: >
    Benchmark chips for Rwanda cut from the 2021 edition of the
    harmonized field boundary collection rw_rwanda_ml.
  license: CC-BY-4.0
  version: 2.0.0-alpha.1
  attribution: "https://doi.org/10.34911/rdnt.g580ww"
  keywords: [field-boundaries, benchmark, rw_rwanda_ml, 2021]
  providers:
    - name: "NASA Harvest"
      roles: [producer, licensor]
      url: https://source.coop/nasa/rwanda-field-boundary-competition
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    # Border chips may cut wall-to-wall labels short; in presence-only data (or outside a
    # label extent) unlabelled pixels are unknown anyway, and sparse samples would lose every chip.
    drop_border_chips: false
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [semantic_2_class, semantic_3_class]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    # Unlabelled pixels inside the extent are background, outside unknown (3).
    label_extent: ../work/extents/rw_rwanda_ml_2021.parquet
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
