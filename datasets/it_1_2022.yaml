# ftwd recipe for Italy, Tuscany — 2022. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/it_1_2022.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/it_1/year=2022/it_1-2022.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/it_1/collection.json
output_dir: staging/it_1_2022
name: it_1_2022
year: 2022

metadata:
  title: "Italy, Tuscany — 2022"
  description: >
    Benchmark chips for Italy-Tuscany cut from the 2022 edition of the
    harmonized field boundary collection it_1.
  license: CC-BY-4.0
  version: 2.0.0-alpha.1
  attribution: "European Commission, Joint Research Centre — EuroCropsV2"
  keywords: [field-boundaries, benchmark, it_1, 2022]
  providers:
    - name: "Joint Research Centre, European Commission"
      roles: [producer, licensor]
      url: https://data.jrc.ec.europa.eu/dataset/b9fb9e67-78a9-4327-9d59-39a928d812d3
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    # Border chips may cut wall-to-wall labels short; in presence-only data unlabelled
    # pixels are unknown anyway, and sparse samples would lose every chip.
    drop_border_chips: true
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    class_filter: filters/it_tuscany_filter.yaml
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
