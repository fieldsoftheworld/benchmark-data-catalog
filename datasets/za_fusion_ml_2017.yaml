# ftwd recipe for South Africa (Fusion) with splits — 2017. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/za_fusion_ml_2017.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/za_fusion_ml/year=2017/za_fusion_ml-2017.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/za_fusion_ml/collection.json
output_dir: staging/za_fusion_ml_2017
name: za_fusion_ml_2017
year: 2017

metadata:
  title: "South Africa (Fusion) with splits — 2017"
  description: >
    Benchmark chips for South Africa (Western Cape) cut from the 2017 edition of the
    harmonized field boundary collection za_fusion_ml.
  license: CC-BY-4.0
  version: 2.0.0-alpha.1
  attribution: "https://data.source.coop/esa/fusion-competition"
  keywords: [field-boundaries, benchmark, za_fusion_ml, 2017]
  providers:
    - name: "ESA Fusion Competition via Source Cooperative"
      roles: [producer, licensor]
      url: https://source.coop/esa/fusion-competition
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    # Border chips may cut wall-to-wall labels short; in presence-only data (or outside a
    # label extent) unlabelled pixels are unknown anyway, and sparse samples would lose every chip.
    drop_border_chips: true
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
