# ftwd recipe for Germany, Saarland — 2026. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/de_sl_2026.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/de_sl/year=2026/de_sl-2026.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/de_sl/collection.json
output_dir: staging/de_sl_2026
name: de_sl_2026
year: 2026

metadata:
  title: "Germany, Saarland — 2026"
  description: >
    Benchmark chips for Germany-SL cut from the 2026 edition of the
    harmonized field boundary collection de_sl.
  license: CC-BY-4.0
  version: 2.0.0-alpha.1
  attribution: "©GDI-SL 2024"
  keywords: [field-boundaries, benchmark, de_sl, 2026]
  providers:
    - name: "Ministerium für Umwelt, Klima, Mobilität, Agrar und Verbraucherschutz"
      roles: [producer, licensor]
      url: https://geoportal.saarland.de
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    drop_border_chips: false
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    class_filter: filters/de-sl-filter.yaml
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: scenes
    cloud_cover_chip: 2.0
    nodata_max: 0.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: preview
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
