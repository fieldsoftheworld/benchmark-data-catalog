# ftwd recipe for Slovenia. Input is the harmonized (fiboa) collection.
# Build with: ftwd run datasets/si.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/si/latest/si.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/si/collection.json
output_dir: staging/si
name: si
# The 2024 edition's growing season is complete, so year equals the edition year.
year: 2024

metadata:
  title: Slovenia
  description: >
    Benchmark chips for Slovenia cut from the harmonized field boundary
    collection for Slovenia (edition 2024).
  license: other
  license_url: https://rkg.gov.si/vstop/
  version: 2.0.0-alpha.1
  attribution: "Ministry of Agriculture, Forestry and Food (Ministrstvo za kmetijstvo, gozdarstvo in prehrano)"
  keywords: [field-boundaries, benchmark, slovenia]
  providers:
    - name: Ministry of Agriculture, Forestry and Food (Ministrstvo za kmetijstvo, gozdarstvo in prehrano)
      roles: [producer, licensor]
      url: https://www.gov.si/drzavni-organi/ministrstva/ministrstvo-za-kmetijstvo-gozdarstvo-in-prehrano/
    - name: Fields of the World
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    # Slovenia is 38,289 grid cells against 809k fields. Coverage batching bounds
    # memory by re-joining the fields side once per window, so a small batch means
    # many rebuilds: 2,000 took ~10 min/batch. 10,000 keeps memory well under the
    # single-statement version that OOM'd while cutting the rebuilds from 19 to 4.
    coverage_batch_size: 10000
    drop_border_chips: false
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    # DECODE labels ship as item assets alongside the instance and semantic masks.
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
  stac:
    checksums: false
  select_images:
    enabled: true
    cloud_cover_chip: 2.0
    nodata_max: 0.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    # Slovenia keeps the remote scene COG as its <season>_visual asset rather than
    # storing a clipped copy per chip; the browser clips client-side. Thumbnails are
    # generated from that remote COG, so no per-chip download is needed.
    enabled: false
    bands: [red, green, blue, nir]
    resolution: 10.0
