# ftwd recipe for Austria — 2024. Input is one year of the harmonized (fiboa) collection.
# Generated by tools/new_dataset.py from tracking.csv; edit freely afterwards.
# Build with: ftwd run datasets/at_2024.yaml   (tools/build.py wraps this)
version: 1

fields_file: https://data.source.coop/ftw/harmonized-field-data/at/year=2024/at-2024.parquet
source_via: https://data.source.coop/ftw/harmonized-field-data/at/collection.json
output_dir: staging/at_2024
name: at_2024
year: 2024

metadata:
  title: "Austria — 2024"
  description: >
    Benchmark chips for Austria cut from the 2024 edition of the
    harmonized field boundary collection at.
  license: CC-BY-4.0
  version: 2.0.0-alpha.1
  attribution: "Agrarmarkt Austria"
  keywords: [field-boundaries, benchmark, at, 2024]
  providers:
    - name: "Agrarmarkt Austria"
      roles: [producer, licensor]
      url: https://geometadatensuche.inspire.gv.at/metadatensuche/inspire/api/records/9db8a0c3-e92a-4df4-9d55-8210e326a7ed
    - name: "Joint Research Centre, European Commission"
      roles: [producer, licensor]
      url: https://data.jrc.ec.europa.eu/dataset/b9fb9e67-78a9-4327-9d59-39a928d812d3
    - name: "Fields of the World"
      roles: [processor]
      url: https://fieldsofthe.world

stages:
  chips:
    min_coverage: 0.01
    drop_border_chips: true
  splits:
    split_type: block3x3
    split_percents: [80, 10, 10]
    random_seed: 42
  masks:
    mask_types: [instance, semantic_2_class, semantic_3_class, decode_boundary, decode_distance]
    resolution: 10.0
    workers: null
    presence_only: false
    # Reuse non-empty mask files on rerun so a repeated masks stage only fills gaps.
    skip_existing: true
    class_filter: filters/austria_filter.yaml
  stac:
    checksums: false
  select_images:
    enabled: true
    imagery_mode: mosaics
    cloud_cover_chip: 2.0
    nodata_max: 100.0
    buffer_days: 14
    num_buffer_expansions: 3
    buffer_expansion_size: 14
  download_images:
    enabled: true
    mode: clip
    workers: 16
    bands: [red, green, blue, nir]
    resolution: 10.0
