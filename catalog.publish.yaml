# What publishes, and where.
#
# Everything under publish_dir is synced 1:1 to write_prefix. Data files are
# never placed under publish_dir, so they cannot be published by accident.

# Source Cooperative: bucket is the org, prefix is the product, addressed
# through the data proxy (endpoint_url) with per-account credentials on the
# named AWS profile (`source-coop login` writes them).
write_prefix: s3://ftw/benchmark-data
public_base: https://data.source.coop/ftw/benchmark-data
endpoint_url: https://data.source.coop
profile: source-coop
region: us-west-2

# The directory that IS the published catalog, synced 1:1 to write_prefix.
publish_dir: catalog

# The staging directory that holds ftwd output, read by tools/upload_data.py.
# Ignored by git. Only the allow-listed suffixes upload.
data_dir: staging
